[package]
name = "espia"
version = "0.1.5"
description = "Espia: compartilhamento de tela entre amigos (app desktop leve)"
authors = ["Diuliano Vargas"]
license = ""
repository = "https://github.com/DiulianoVargas/espia"
edition = "2024"
rust-version = "1.90"

[lib]
name = "espia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2"
serde_json = "1"
url = "2"

serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
base64 = "0.22"
webview2-com = "0.39"
windows-core = "0.62"
# Captura nativa (specs/005): janelas/monitores, miniaturas (WIC), WGC + D3D11, som por processo.
windows = { version = "0.62", features = [
  "Foundation",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Media_KernelStreaming",
  "Win32_Media_Multimedia",
  "Security_Authorization_AppCapabilityAccess",
  "Win32_Storage_FileSystem",
  "Win32_Security",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# Leve: binário pequeno (SC-001).
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
