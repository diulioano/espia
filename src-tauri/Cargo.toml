[package]
name = "espia"
version = "0.1.2"
description = "Espia: compartilhamento de tela entre amigos (app desktop leve)"
authors = ["Diuliano Vargas"]
license = ""
repository = "https://github.com/DiulianoVargas/espia"
edition = "2024"
rust-version = "1.90"

[lib]
name = "espia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2"
serde_json = "1"
url = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

# Leve: binário pequeno (SC-001).
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
