[package]
name = "espia"
description = "Espia.exe: junta todas as crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
espia-core.workspace = true
espia-net.workspace = true
espia-media.workspace = true
espia-capture.workspace = true
espia-shell.workspace = true
espia-ui.workspace = true
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "macros"] }
arboard = { version = "3.7.0", default-features = false }
time = { version = "0.3.55", features = ["local-offset"] }

[dev-dependencies]
futures-util = "0.3.34"
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "macros", "net", "io-util"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
